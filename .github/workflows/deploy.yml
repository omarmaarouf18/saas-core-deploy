name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: [self-hosted, saas-vm]

    steps:
      - name: Fix Workspace File Ownership
        run: |
          docker run --rm -v $(pwd):/work alpine chown -R $(id -u):$(id -g) /work 2>/dev/null || true

      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ensure Production Environment File
        run: |
          if [ ! -f .env ]; then
            if [ -f /home/deploybot/.env ]; then
              echo "Restoring persistent production environment from /home/deploybot/.env..."
              cp /home/deploybot/.env .env
            elif [ -f /opt/saas-platform/.env ] && [ -r /opt/saas-platform/.env ]; then
              echo "Copying environment from /opt/saas-platform/.env..."
              cp /opt/saas-platform/.env .env
            else
              echo "Creating environment from .env.example with defaults..."
              cp .env.example .env
              sed -i 's|^MONGO_INITDB_ROOT_PASSWORD=.*|MONGO_INITDB_ROOT_PASSWORD=change_me_mongo_secret|g' .env
              sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=change_me_redis_secret|g' .env
              sed -i 's|^JWT_SECRET=.*|JWT_SECRET=change_me_jwt_secret|g' .env
              sed -i 's|^GATEWAY_SECRET=.*|GATEWAY_SECRET=change_me_gateway_secret|g' .env
              sed -i 's|^INTERNAL_SERVICE_TOKEN=.*|INTERNAL_SERVICE_TOKEN=change_me_internal_token|g' .env
              sed -i 's|^OTP_AES_KEY=.*|OTP_AES_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f|g' .env
              sed -i 's|CHANGE_ME_PASSWORD|change_me_mongo_secret|g' .env
            fi
          fi
          cp .env /home/deploybot/.env 2>/dev/null || true

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating docker-compose.yml configuration..."
          docker compose config --quiet || {
            echo "::error::docker-compose.yml validation failed!"
            docker compose config
            exit 1
          }
          echo "docker-compose.yml configuration is valid."

      - name: Pull Production Container Images
        run: |
          echo "Pulling updated production container images..."
          docker compose pull

      - name: Deploy Container Services with Pinned Volume Names
        run: |
          echo "Deploying updated services..."
          docker compose up -d --remove-orphans
          echo "=== DOCKER COMPOSE CONTAINER STATUS ==="
          docker compose ps

      - name: Inspect MongoDB Startup Logs
        run: |
          echo "=== MONGODB STARTUP LOGS ==="
          docker compose logs mongo --tail=30

      - name: Verify Service Health
        run: |
          echo "Verifying API Gateway health status..."
          MAX_RETRIES=12
          RETRY_DELAY=5
          SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i of $MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" "http://localhost:8080/health" || echo "000")
            if [ "$HTTP_STATUS" != "200" ]; then
              HTTP_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" "https://localhost:8080/health" || echo "000")
            fi

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check succeeded with HTTP 200!"
              SUCCESS=1
              break
            else
              echo "Health check attempt $i returned HTTP status $HTTP_STATUS."
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Waiting $RETRY_DELAY seconds before retrying..."
                sleep $RETRY_DELAY
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Health check failed after $MAX_RETRIES attempts!"
            exit 1
          fi

      - name: Reset File Ownership for Workspace
        if: always()
        run: |
          docker run --rm -v $(pwd):/work alpine chown -R $(id -u):$(id -g) /work 2>/dev/null || true

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          echo "================================================================="
          echo "DEPLOYMENT FAILURE LOG DUMP (Last 50 lines per container)"
          echo "================================================================="
          docker compose ps
          echo "-----------------------------------------------------------------"
          docker compose logs --tail=50
          echo "================================================================="
