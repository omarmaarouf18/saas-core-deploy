name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    name: MongoDB Diagnostic Check
    runs-on: [self-hosted, saas-vm]

    steps:
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4

      - name: Ensure Production Environment File
        run: |
          if [ ! -f .env ]; then
            if [ -f /opt/saas-platform/.env ]; then
              cp /opt/saas-platform/.env .env
            else
              cp .env.example .env
            fi
          fi

      - name: Step 1 - Confirm Exact Volume Name
        run: |
          echo "=== STEP 1: DOCKER VOLUME LIST ==="
          pwd
          docker volume ls | grep mongo

      - name: Step 2 - Test Current .env Password
        run: |
          echo "=== STEP 2: TEST CURRENT ENV PASSWORD ==="
          source .env
          docker exec saas-mongo mongosh -u root -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping')" || true

      - name: Step 3 - Test Unauthenticated Connection
        run: |
          echo "=== STEP 3: UNAUTHENTICATED MONGO CONNECTION ==="
          docker exec saas-mongo mongosh --eval "db.adminCommand('ping')" 2>&1 | head -5 || true

      - name: Step 4 - Search for Original Password Traces
        run: |
          echo "=== STEP 4: SEARCH FOR ENV BACKUPS AND HISTORY ==="
          echo "--- find *.env* ---"
          find / -maxdepth 5 -iname "*.env*" 2>/dev/null || true
          echo "--- find *.bak / .old / .orig ---"
          find / -maxdepth 5 -iname "*.env*.bak" -o -iname ".env.old" -o -iname ".env.orig" 2>/dev/null || true
          echo "--- history grep mongo ---"
          history | grep -i -E "mongo|openssl rand|MONGO_INITDB" || true
          echo "--- bash_history ---"
          cat ~/.bash_history 2>/dev/null | grep -i mongo || true

      - name: Step 5 - Container vs File Timestamps
        run: |
          echo "=== STEP 5: CONTAINER VS ENV TIMESTAMPS ==="
          echo "Container Created:"
          docker inspect saas-mongo --format '{{.Created}}' || true
          echo ".env Modified:"
          stat -c '%y' .env || true
          echo "/opt/saas-platform/.env Modified:"
          stat -c '%y' /opt/saas-platform/.env 2>/dev/null || true

      - name: Step 6 - List All Mongo Volumes and Mountpoints
        run: |
          echo "=== STEP 6: ALL MONGO VOLUMES AND MOUNTPOINTS ==="
          docker volume ls | grep -i mongo || true
          for v in $(docker volume ls -q | grep -i mongo); do echo "--- $v ---"; docker volume inspect "$v" --format '{{.Mountpoint}}'; done
